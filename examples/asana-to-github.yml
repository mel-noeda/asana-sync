# Copy to .github/workflows/asana-to-github.yml in the consuming repository.
# This example writes issues in this repository and omits GitHub Projects, so
# the built-in job token is enough (grant issues: write). Pass GH_TOKEN when
# the target repo is different or you link a Projects board.

name: Asana → GitHub

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: mel-noeda/asana-sync@v1
        with:
          mode: a2g
          asana_token: ${{ secrets.ASANA_TOKEN }}
          asana_project_gid: "111"
          github_repo: ${{ github.repository }}
          asana_section: In Progress
