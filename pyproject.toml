[project]
name = "asana-sync"
version = "1.0.0"
description = "Two-way sync between Asana tasks and GitHub issues or Projects"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests",
    "python-dotenv",
]

[project.scripts]
A2G = "asana_sync.asana_to_github:main"
G2A = "asana_sync.github_to_asana:main"
delete-issues = "asana_sync.delete_issues:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asana_sync"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "responses",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["asana_sync"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
