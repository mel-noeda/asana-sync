[project]
name = "asana-sync"
version = "1.0.0"
description = "Two-way sync between Asana tasks and GitHub issues or Projects"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests",
    "python-dotenv",
]

[project.scripts]
A2G = "asana_to_github:main"
G2A = "github_to_asana:main"
delete-issues = "delete_issues:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["asana_to_github.py", "github_to_asana.py", "config.py", "log.py", "delete_issues.py", "cfg.py", "asana_columns.py"]

[dependency-groups]
dev = [
    "ruff",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["asana_columns", "asana_to_github", "cfg", "config", "delete_issues", "github_to_asana", "log"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
