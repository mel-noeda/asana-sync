name: Asana Sync
description: Two-way sync between Asana tasks and GitHub issues or Projects.
author: mel-noeda
branding:
  icon: refresh-cw
  color: blue

inputs:
  mode:
    description: "Sync direction — a2g (Asana → GitHub) or g2a (GitHub → Asana)"
    required: true
  asana_token:
    description: Asana personal access token
    required: true
  github_token:
    description: PAT from secret GH_TOKEN. Optional when github_repo is this repository and GitHub Projects is unset
    required: false
    default: ""
  asana_project_gid:
    description: Asana project GID
    required: true
  github_project_owner:
    description: Projects v2 owner (org or user)
    required: false
    default: ""
  github_project_number:
    description: Projects v2 number
    required: false
    default: ""
  github_repo:
    description: Target repository as owner/repo
    required: false
    default: ""
  asana_section:
    description: Only import Asana tasks in this section (comma-separated). A2G only
    required: false
    default: ""
  asana_status_field:
    description: Match asana_section against this custom field instead of a board section. A2G only
    required: false
    default: ""
  dry_run:
    description: Preview without writing
    required: false
    default: "false"
  sync_completed:
    description: A2G also pulls completed Asana tasks
    required: false
    default: "false"
  default_labels:
    description: Comma-separated labels for A2G repo issues
    required: false
    default: ""
  asana_github_issue_field_gid:
    description: Override GID for the Asana "GitHub Issue #" custom field
    required: false
    default: ""
  issue_number:
    description: GitHub issue or pull request number (g2a single-item mode)
    required: false
    default: ""
  columns_only:
    description: G2A only syncs Status → Asana section (and completion)
    required: false
    default: "false"
  sync_all_project_items:
    description: G2A syncs every Issue/PR on the Projects v2 board
    required: false
    default: "false"
  github_project_status:
    description: Override Projects Status name (skips GraphQL lookup)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        working-directory: ${{ github.action_path }}
        ignore-empty-workdir: true

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: uv sync --frozen

    - name: Run sync
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ASANA_TOKEN: ${{ inputs.asana_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
        ASANA_PROJECT_GID: ${{ inputs.asana_project_gid }}
        GITHUB_PROJECT_OWNER: ${{ inputs.github_project_owner }}
        GITHUB_PROJECT_NUMBER: ${{ inputs.github_project_number }}
        GITHUB_REPO: ${{ inputs.github_repo }}
        ASANA_SECTION: ${{ inputs.asana_section }}
        ASANA_STATUS_FIELD: ${{ inputs.asana_status_field }}
        DRY_RUN: ${{ inputs.dry_run }}
        SYNC_COMPLETED: ${{ inputs.sync_completed }}
        DEFAULT_LABELS: ${{ inputs.default_labels }}
        ASANA_GITHUB_ISSUE_FIELD_GID: ${{ inputs.asana_github_issue_field_gid }}
        GITHUB_ISSUE_NUMBER: ${{ inputs.issue_number }}
        COLUMNS_ONLY: ${{ inputs.columns_only }}
        SYNC_ALL_PROJECT_ITEMS: ${{ inputs.sync_all_project_items }}
        GITHUB_PROJECT_STATUS: ${{ inputs.github_project_status }}
        SYNC_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail

        mode="$(printf '%s' "$SYNC_MODE" | tr '[:upper:]' '[:lower:]')"
        if [ "$mode" != "a2g" ] && [ "$mode" != "g2a" ]; then
          echo "::error::mode must be a2g or g2a, got: ${SYNC_MODE}"
          exit 1
        fi

        missing=0
        if [ -z "$ASANA_TOKEN" ]; then
          echo "::error::asana_token is required"
          missing=1
        fi
        current_repo="${GITHUB_REPOSITORY:-}"
        target_repo="${GITHUB_REPO:-$current_repo}"
        using_project=false
        if [ -n "${GITHUB_PROJECT_OWNER:-}" ] && [ -n "${GITHUB_PROJECT_NUMBER:-}" ]; then
          using_project=true
        fi
        if [ -z "${GH_TOKEN}" ]; then
          current_lc="$(printf '%s' "$current_repo" | tr '[:upper:]' '[:lower:]')"
          target_lc="$(printf '%s' "$target_repo" | tr '[:upper:]' '[:lower:]')"
          if [ "$using_project" = "true" ]; then
            echo "::error::GitHub Projects requires a PAT. Set secret GH_TOKEN."
            missing=1
          elif [ -z "$current_repo" ] || [ "$target_lc" != "$current_lc" ]; then
            echo "::error::Secret GH_TOKEN is required when the target repository is not this repository"
            missing=1
          else
            echo "Using the built-in GITHUB_TOKEN for ${target_repo} (same repository, no Projects board)."
          fi
        fi
        if [ -z "$ASANA_PROJECT_GID" ]; then
          echo "::error::asana_project_gid is required"
          missing=1
        elif printf '%s' "$ASANA_PROJECT_GID" | grep -Eq '[eE]'; then
          echo "::error::asana_project_gid looks like a float (${ASANA_PROJECT_GID}). Quote it as a string, for example asana_project_gid: \"1210771720905224\""
          missing=1
        fi

        if [ "$mode" = "a2g" ]; then
          if [ -z "$GITHUB_REPO" ] && { [ -z "$GITHUB_PROJECT_OWNER" ] || [ -z "$GITHUB_PROJECT_NUMBER" ]; }; then
            echo "::error::Configure github_project_owner + github_project_number and/or github_repo"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          a2g_args=()
          if [ -n "${ASANA_SECTION}" ]; then
            a2g_args+=(--section "$ASANA_SECTION")
          fi
          if [ -n "${ASANA_STATUS_FIELD}" ]; then
            a2g_args+=(--status-field "$ASANA_STATUS_FIELD")
          fi
          if [ -n "$GITHUB_REPO" ]; then
            a2g_args+=(--repo "$GITHUB_REPO")
          fi
          if [ -n "$ASANA_PROJECT_GID" ]; then
            a2g_args+=(--project-gid "$ASANA_PROJECT_GID")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            a2g_args+=(--dry-run)
          fi
          if [ "$SYNC_COMPLETED" = "true" ]; then
            a2g_args+=(--sync-completed)
          fi
          uv run A2G "${a2g_args[@]}"
          exit 0
        fi

        if [ "$SYNC_ALL_PROJECT_ITEMS" = "true" ]; then
          if [ -z "$GITHUB_PROJECT_OWNER" ] || [ -z "$GITHUB_PROJECT_NUMBER" ]; then
            echo "::error::sync_all_project_items requires github_project_owner and github_project_number"
            missing=1
          fi
        elif [ -z "$GITHUB_ISSUE_NUMBER" ]; then
          echo "::error::g2a requires issue_number, or set sync_all_project_items=true"
          missing=1
        elif [ -z "$GITHUB_REPO" ]; then
          echo "::error::g2a single-item mode requires github_repo"
          missing=1
        fi
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi

        args=()
        if [ "$SYNC_ALL_PROJECT_ITEMS" = "true" ]; then
          args+=(--all-project-items)
          echo "Reconciling all project items on ${GITHUB_PROJECT_OWNER}/#${GITHUB_PROJECT_NUMBER}"
        else
          args+=(--issue "$GITHUB_ISSUE_NUMBER")
          echo "Syncing ${GITHUB_REPO}#${GITHUB_ISSUE_NUMBER} → Asana"
        fi
        if [ "$COLUMNS_ONLY" = "true" ]; then
          args+=(--columns-only)
          echo "Mode: columns-only (Status → Asana section)"
        fi
        uv run G2A "${args[@]}"
