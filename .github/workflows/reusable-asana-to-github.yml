name: Reusable Asana → GitHub

on:
  workflow_call:
    inputs:
      asana_project_gid:
        description: Asana project GID (falls back to secret ASANA_PROJECT_GID)
        type: string
        required: false
        default: ""
      github_repo:
        description: Target repository as owner/repo
        type: string
        required: false
        default: ""
      asana_section:
        description: Only import tasks in this Asana section (comma-separated)
        type: string
        required: false
        default: ""
      asana_status_field:
        description: Match asana_section against this custom field instead of a board section
        type: string
        required: false
        default: ""
      github_project_owner:
        description: Projects v2 owner (optional extra link)
        type: string
        required: false
        default: ""
      github_project_number:
        description: Projects v2 number (optional extra link)
        type: string
        required: false
        default: ""
      dry_run:
        description: Preview without creating anything
        type: boolean
        required: false
        default: false
      sync_completed:
        description: Also sync completed Asana tasks
        type: boolean
        required: false
        default: false
    secrets:
      ASANA_TOKEN:
        required: true
      GH_TOKEN:
        required: false
      ASANA_PROJECT_GID:
        required: false
      GITHUB_PROJECT_OWNER:
        required: false
      GITHUB_PROJECT_NUMBER:
        required: false
      GITHUB_REPO:
        required: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asana-sync
        uses: actions/checkout@v4
        with:
          repository: mel-noeda/asana-sync
          ref: ${{ github.workflow_sha }}

      - name: Sync Asana → GitHub
        uses: ./
        with:
          mode: a2g
          asana_token: ${{ secrets.ASANA_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          asana_project_gid: ${{ inputs.asana_project_gid || secrets.ASANA_PROJECT_GID }}
          github_project_owner: ${{ inputs.github_project_owner || secrets.GITHUB_PROJECT_OWNER }}
          github_project_number: ${{ inputs.github_project_number || secrets.GITHUB_PROJECT_NUMBER }}
          github_repo: ${{ inputs.github_repo || secrets.GITHUB_REPO }}
          asana_section: ${{ inputs.asana_section }}
          asana_status_field: ${{ inputs.asana_status_field }}
          dry_run: ${{ inputs.dry_run }}
          sync_completed: ${{ inputs.sync_completed }}
