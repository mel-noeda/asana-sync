name: Asana sync

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour (UTC)
  push:
    branches: [main, master]
  issues:
    types: [edited, labeled, unlabeled, assigned, reopened, closed]
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      asana_project_gid:
        description: "Asana project GID"
        required: false
        type: string
      github_project_owner:
        description: "GitHub Projects v2 owner"
        required: false
        type: string
      github_project_number:
        description: "GitHub Projects v2 number"
        required: false
        type: string
      github_repo:
        description: "Target repo as owner/repo for real issues"
        required: false
        type: string
      asana_section:
        description: "Only import tasks in this Asana section (comma-separated)"
        required: false
        type: string
      asana_status_field:
        description: "Match asana_section against this custom field instead of a board section"
        required: false
        type: string
      dry_run:
        description: "Preview without creating anything"
        required: false
        type: boolean
        default: false
      sync_completed:
        description: "Also sync completed Asana tasks"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Asana → GitHub
        uses: ./
        with:
          mode: a2g
          asana_token: ${{ secrets.ASANA_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          asana_project_gid: ${{ inputs.asana_project_gid || secrets.ASANA_PROJECT_GID }}
          github_project_owner: ${{ inputs.github_project_owner || secrets.GITHUB_PROJECT_OWNER }}
          github_project_number: ${{ inputs.github_project_number || secrets.GITHUB_PROJECT_NUMBER }}
          github_repo: ${{ inputs.github_repo || secrets.GITHUB_REPO }}
          asana_section: ${{ inputs.asana_section }}
          asana_status_field: ${{ inputs.asana_status_field }}
          dry_run: ${{ inputs.dry_run }}
          sync_completed: ${{ inputs.sync_completed }}
